<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dipti Kumari | AI IVR Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #050816;
      color: #ffffff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(92,103,255,0.2), transparent 70%);
      top: -100px;
      right: -100px;
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,255,213,0.15), transparent 70%);
      bottom: -100px;
      left: -100px;
      z-index: -1;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 40px 0;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
      flex-wrap: wrap;
    }

    .hero-left {
      flex: 1;
    }

    .tag {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      margin-bottom: 20px;
      color: #00ffd5;
      font-size: 14px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.05);
    }

    h1 {
      font-size: 70px;
      line-height: 1.1;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .gradient {
      background: linear-gradient(90deg, #00ffd5, #6a7dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #c8d0e0;
      line-height: 1.8;
      max-width: 700px;
      font-size: 18px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 26px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .primary {
      background: linear-gradient(135deg, #00ffd5, #5c67ff);
      color: #000;
    }

    .secondary {
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      background: rgba(255,255,255,0.05);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(92,103,255,0.25);
    }

    .hero-card {
      flex: 0.9;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .hero-card h3 {
      margin-bottom: 25px;
      color: #00ffd5;
      font-size: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .stat {
      background: rgba(255,255,255,0.04);
      padding: 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat h2 {
      font-size: 32px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .stat p {
      font-size: 14px;
      color: #b4bdd1;
    }

    section {
      margin-top: 120px;
    }

    .section-title {
      font-size: 40px;
      margin-bottom: 40px;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      width: 60%;
      height: 4px;
      border-radius: 20px;
      position: absolute;
      left: 0;
      bottom: -10px;
      background: linear-gradient(90deg, #00ffd5, #5c67ff);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 30px;
      transition: 0.3s ease;
      backdrop-filter: blur(16px);
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .card h3 {
      margin-bottom: 18px;
      font-size: 22px;
      color: #00ffd5;
    }

    .card ul {
      padding-left: 20px;
      color: #d7deee;
      line-height: 1.8;
    }

    .timeline {
      border-left: 2px solid rgba(255,255,255,0.2);
      margin-left: 20px;
      padding-left: 40px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 50px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00ffd5;
      left: -50px;
      top: 5px;
      box-shadow: 0 0 20px #00ffd5;
    }

    .timeline-item h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .timeline-item span {
      color: #00ffd5;
      font-size: 14px;
    }

    .timeline-item p {
      color: #cbd4e5;
      margin-top: 15px;
      line-height: 1.8;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .skill {
      padding: 12px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #ffffff;
      transition: 0.3s ease;
    }

    .skill:hover {
      background: linear-gradient(135deg, #00ffd5, #5c67ff);
      color: #000;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      color: #aeb7c8;
      margin-top: 100px;
    }
